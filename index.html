<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="思修题库">
<title>思想道德修养与法律基础 · 题库</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#000; --text2:#3c3c43; --muted:#8e8e93;
  --line:rgba(60,60,67,.14); --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.16);
  --accent:#007aff; --accent-soft:rgba(0,122,255,.12);
  --ok:#34c759; --ok-bg:rgba(52,199,89,.14);
  --bad:#ff3b30; --bad-bg:rgba(255,59,48,.12);
  --gold:#ff9500; --gold-bg:rgba(255,149,0,.14);
  --header:rgba(242,242,247,.82); --seg:rgba(118,118,128,.12); --seg-on:#fff;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1c1c1e; --text:#fff; --text2:#ebebf5; --muted:#98989f;
  --line:rgba(255,255,255,.14); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.22);
  --ok:#30d158; --ok-bg:rgba(48,209,88,.18);
  --bad:#ff453a; --bad-bg:rgba(255,69,58,.16);
  --gold:#ffd60a; --gold-bg:rgba(255,214,10,.16);
  --header:rgba(0,0,0,.78); --seg:rgba(118,118,128,.24); --seg-on:#636366;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{
  position:sticky;top:0;z-index:20;background:var(--header);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
}
.bar{display:flex;align-items:center;gap:8px;min-width:0}
.brand{font-weight:700;font-size:17px;letter-spacing:-.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:590;color:var(--muted);background:var(--fill);border-radius:999px;padding:4px 11px;white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums}
.fav{background:none;border:0;font-size:21px;cursor:pointer;padding:0 2px;color:var(--fill2);line-height:1;flex:0 0 auto;transition:transform .15s,color .15s}
.fav:active{transform:scale(.88)}
.fav.on{color:var(--gold)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:16px;font-weight:500;cursor:pointer;padding:0 2px;flex:0 0 auto}
.sub{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.timer.warn{color:var(--bad)}
.progress{height:4px;background:var(--fill2);border-radius:999px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;border-radius:999px;transition:width .3s cubic-bezier(.25,.1,.25,1)}
.tabs{display:flex;gap:2px;margin-top:10px;background:var(--seg);border-radius:11px;padding:3px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:590;padding:7px 2px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.filters{display:flex;gap:8px;margin-top:10px}
.filters select{
  flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--card);
  border:0;border-radius:11px;padding:9px 30px 9px 12px;appearance:none;box-shadow:var(--shadow);
  text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.g{background:var(--fill);color:var(--muted)}
.stem{font-size:18px;line-height:1.72;font-weight:600;letter-spacing:-.2px;margin:0 0 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--fill);border:1.5px solid transparent;border-radius:13px;
  padding:13px 14px;font:inherit;font-size:16px;color:var(--text);cursor:pointer;transition:.16s;
}
.opt:active{transform:scale(.985)}
.opt .key{flex:0 0 25px;height:25px;border-radius:8px;background:var(--fill2);color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .txt{flex:1;min-width:0;white-space:pre-wrap;line-height:1.62;overflow-wrap:anywhere}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .key{background:var(--accent);color:#fff}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .key{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .key{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.pick{background:var(--accent-soft);border-color:var(--accent)}
input.fill{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;outline:none}
input.fill:focus{background:var(--card);border-color:var(--accent)}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:12px;padding:11px 20px;border:0;background:var(--fill);color:var(--text);cursor:pointer;transition:.16s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{font-size:13.5px;padding:8px 14px;border-radius:10px}
.btn.wide{width:100%;justify-content:center;padding:14px}
.btn[disabled]{opacity:.38;cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:15px}
.fb.right{background:var(--ok-bg)}
.fb.wrong{background:var(--bad-bg)}
.fb.peek{background:var(--accent-soft)}
.fb .res{font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px;font-size:15.5px}
.fb.right .res{color:var(--ok)}
.fb.wrong .res{color:var(--bad)}
.fb.peek .res{color:var(--accent)}
.fb .ans{font-size:15.5px;margin-bottom:9px;line-height:1.7;overflow-wrap:anywhere}
.fb .ans b{font-weight:700}
.fb.right .ans b{color:var(--ok)}
.fb.wrong .ans b{color:var(--bad)}
.fb .exp{font-size:15px;line-height:1.8;white-space:pre-wrap;color:var(--text2);overflow-wrap:anywhere}
.fb .exp .lab{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin-bottom:5px}
.row{display:flex;align-items:center;gap:9px;margin-top:16px;flex-wrap:wrap}
.row .spacer{flex:1;min-width:6px}
.hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:56px 16px;font-size:15px;line-height:2}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.item:active{transform:scale(.99)}
.item .no{flex:0 0 26px;height:26px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.item .no.g{background:var(--gold-bg);color:var(--gold)}
.item .no.n{background:var(--fill);color:var(--muted)}
.item .q{flex:1;min-width:0;font-size:15px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rowline{display:flex;align-items:center;gap:10px;padding:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-top:10px;cursor:pointer}
.rowline .t{flex:1;min-width:0;font-size:15.5px}
.rowline .v{color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--fill2);font-size:17px;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 10px;text-align:center}
.stat .n{font-size:26px;font-weight:800;color:var(--accent);line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
h3{font-size:13px;margin:26px 0 0 4px;color:var(--muted);font-weight:600;letter-spacing:.3px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);table-layout:fixed}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}
th{color:var(--muted);font-size:12px;font-weight:600}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{width:auto}
th.n,td.n{text-align:right;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;width:74px}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);margin-top:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.switch span{flex:1;min-width:0}
.field{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-top:10px}
.field .lab{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;font:inherit;font-size:14px;font-weight:560;padding:8px 14px;border-radius:999px;background:var(--fill);color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:10px}
.grid button{aspect-ratio:1;border:0;border-radius:10px;background:var(--fill);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--accent-soft);color:var(--accent)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:-2px}
.grid button.ok{background:var(--ok-bg);color:var(--ok)}
.grid button.no{background:var(--bad-bg);color:var(--bad)}
.flash{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px 18px;margin-top:14px;min-height:270px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:.2s}
.flash:active{transform:scale(.99)}
.flash .d{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.3px;margin-bottom:8px}
.flash .ti{font-size:20px;font-weight:700;line-height:1.5;letter-spacing:-.3px;overflow-wrap:anywhere}
.flash .bd{font-size:15.5px;line-height:1.85;color:var(--text2);margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.flash .tap{font-size:12.5px;color:var(--muted);margin-top:16px;text-align:center}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.bigS{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.lrow{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.lrow .sp{flex:1}
@media(max-width:420px){
  .wrap{padding-left:12px;padding-right:12px}
  header{margin:0 -12px;padding-left:12px;padding-right:12px}
  .card{padding:15px}
  .stem{font-size:17px}
  .opt{font-size:15.5px;padding:12px 13px;gap:10px}
  .brand{font-size:16px}
  .flash .ti{font-size:18.5px}
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <button class="back" id="backBtn" style="display:none">‹ 返回</button>
      <div class="brand" id="title">思想道德修养与法律基础</div>
      <div class="pill" id="counter">0 / 0</div>
      <button class="fav" id="favBtn" title="收藏本题">★</button>
    </div>
    <div class="sub" id="sub"></div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="tabs" id="tabs">
      <button data-v="quiz" class="on">刷题</button>
      <button data-v="exam">考试</button>
      <button data-v="cards">时政</button>
      <button data-v="data">我的</button>
    </div>
    <div class="filters" id="filters">
      <select id="chapterSel"></select>
      <select id="scopeSel">
        <option value="all">全部题目</option>
        <option value="undone">只做没做过的</option>
        <option value="wrong">只做错题</option>
        <option value="fav">只做收藏</option>
      </select>
    </div>
  </header>
  <main id="main"></main>
</div>

", "t": "judge", "s": "因不满十六周岁不予刑事处罚的，责令其父母或者其他监护人加以管教，在必要的 时候，依法进行专门矫治教育。( )", "o": ["正确", "错误"], "a": 0, "e": "√ 因不满十六周岁不予刑事处罚的，责令其父母或其他监护人加以管教，必要时依法进行专门矫治教育。"}, {"id": "c8-j4", "c": "第八章 刑 法", "t": "judge", "s": "间歇性的精神病人在精神正常的时候犯罪，应当负刑事责任。( )", "o": ["正确", "错误"], "a": 0, "e": "√ 间歇性的精神病人在精神正常的时候犯罪，应当负刑事责任。"}, {"id": "c8-j5", "c": "第八章 刑 法", "t": "judge", "s": "意外事件是指行为在客观上虽然造成了损害结果，但不是出于行为人的故意或者过 失，而是由于不可抗拒的原因所引起的。( )", "o": ["正确", "错误"], "a": 1, "e": "× 意外事件是由于不能抗拒或者不能预见的原因引起的，本题只说了“不可抗拒”，表述不完整。"}, {"id": "c8-j6", "c": "第八章 刑 法", "t": "judge", "s": "剥夺政治权利包括剥夺受教育权。( )", "o": ["正确", "错误"], "a": 1, "e": "× 剥夺政治权利不包括剥夺受教育权。"}, {"id": "c8-j7", "c": "第八章 刑 法", "t": "judge", "s": "对于犯罪的外国人，可以独立适用或者附加适用驱逐出境。( )", "o": ["正确", "错误"], "a": 0, "e": "√ 对于犯罪的外国人，可以独立适用或者附加适用驱逐出境。"}, {"id": "c8-j8", "c": "第八章 刑 法", "t": "judge", "s": "假释是指被判处有期徒刑或者无期徒刑的犯罪人，在执行一定刑期之后，确有悔改 表现，不致再危害社会而附有条件地将其提前释放的一种刑罚制度。( )", "o": ["正确", "错误"], "a": 0, "e": "√ 假释是对判处有期徒刑或无期徒刑的犯罪人，在执行一定刑期后附条件提前释放的刑罚执行制度。"}, {"id": "c8-j9", "c": "第八章 刑 法", "t": "judge", "s": "在人民检察院、公安机关、国家安全机关立案侦查或者在人民法院受理案件以后， 逃避侦查或者审判的，应受追诉期限的限制。( )", "o": ["正确", "错误"], "a": 1, "e": "× 立案侦查或受理案件后逃避侦查或审判的，不受追诉期限的限制。"}, {"id": "c8-j10", "c": "第八章 刑 法", "t": "judge", "s": "我国刑法对追诉时效和行刑时效都做了规定。( )", "o": ["正确", "错误"], "a": 1, "e": "× 我国刑法只规定了追诉时效，没有规定行刑时效。"}, {"id": "szj1", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年7月2日，2025全球数字经济大会在北京开幕，主题为“建设数字友好城市”。", "o": ["正确", "错误"], "a": 0, "e": "正确。大会在北京开幕，主题为“建设数字友好城市”，并成立“全球数字经济城市联盟”。"}, {"id": "szj2", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年7月7日，全国多地举办纪念全民族抗战爆发90周年系列活动。", "o": ["正确", "错误"], "a": 1, "e": "错误。是纪念全民族抗战爆发88周年，不是90周年。"}, {"id": "szj3", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年7月9日，中国科学院联合多家科研机构发布嫦娥六号月球样品最新研究成果，首次系统揭示月球背面地质演化历程。", "o": ["正确", "错误"], "a": 0, "e": "正确。该成果首次系统揭示月球背面地质演化历程，填补国际相关领域空白。"}, {"id": "szj4", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "第十次全国对口支援新疆工作会议在新疆乌鲁木齐召开。", "o": ["正确", "错误"], "a": 1, "e": "错误。会议在新疆和田召开，不是乌鲁木齐。"}, {"id": "szj5", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年7月11日，第47届世界遗产大会将中国“西夏陵”列入《世界遗产名录》，至此我国世界遗产总数达到60项。", "o": ["正确", "错误"], "a": 0, "e": "正确。“西夏陵”列入《世界遗产名录》，我国世界遗产总数达到60项。"}, {"id": "szj6", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年9月3日是中国人民抗日战争暨世界反法西斯战争胜利70周年纪念日。", "o": ["正确", "错误"], "a": 1, "e": "错误。2025年9月3日是胜利80周年纪念日，中国人民历经14年浴血奋战。"}, {"id": "szj7", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年9月12日，十四届全国人大常委会第十七次会议表决通过《中华人民共和国法治宣传教育法》，自2025年11月1日起施行。", "o": ["正确", "错误"], "a": 0, "e": "正确。该法自2025年11月1日起施行。"}, {"id": "szj8", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年9月，中共中央印发了《中国共产党宣传工作条例》。", "o": ["正确", "错误"], "a": 1, "e": "错误。印发的是《中国共产党思想政治工作条例》。"}, {"id": "szj9", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年9月17日，全球公共安全合作论坛（连云港）2025年大会在江苏连云港举行。", "o": ["正确", "错误"], "a": 0, "e": "正确。大会主题为“共塑全球公共安全：团结行动，应对多元威胁”。"}, {"id": "szj10", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年10月20日，国际调解院开业仪式在中国香港举行。", "o": ["正确", "错误"], "a": 0, "e": "正确。国际调解院是中国牵头推动的政府间国际组织，旨在以非对抗方式化解国际争端。"}, {"id": "szj11", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年10月24日，十四届全国人大常委会第十八次会议决定以法律形式将10月25日设立为台湾光复纪念日。", "o": ["正确", "错误"], "a": 0, "e": "正确。会议作出决定，以法律形式将10月25日设立为台湾光复纪念日。"}, {"id": "szj12", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "十四届全国人大常委会第十八次会议通过的关于修改《网络安全法》的决定，自2025年12月1日起施行。", "o": ["正确", "错误"], "a": 1, "e": "错误。该决定自2026年1月1日起施行。"}, {"id": "szj13", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年11月5日，我国第三艘航空母舰福建舰在海南三亚某军港正式入列授旗，舷号为“18”。", "o": ["正确", "错误"], "a": 0, "e": "正确。福建舰是我国完全自主设计建造的首艘电磁弹射型航母，标志海军迈入“三航母时代”。"}, {"id": "szj14", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "中华人民共和国第十五届运动会由广东省单独承办。", "o": ["正确", "错误"], "a": 1, "e": "错误。本届全运会由粤港澳三地首次联合承办。"}, {"id": "szj15", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年11月10日至22日，《联合国气候变化框架公约》第三十次缔约方大会（COP30）在巴西贝伦举行。", "o": ["正确", "错误"], "a": 0, "e": "正确。大会达成“贝伦一揽子政治成果”。"}, {"id": "szj16", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "《习近平法治文选》第一卷共收入习近平同志关于法治建设的著作100篇。", "o": ["正确", "错误"], "a": 1, "e": "错误。共收入报告、讲话、演讲、指示、批示等69篇。"}, {"id": "szj17", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年11月17日至18日，中央全面依法治国工作会议在北京召开。", "o": ["正确", "错误"], "a": 0, "e": "正确。习近平总书记对全面依法治国工作作出重要指示。"}, {"id": "szj18", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年12月4日是第十个国家宪法日。", "o": ["正确", "错误"], "a": 1, "e": "错误。2025年12月4日是第十二个国家宪法日。"}, {"id": "szj19", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年12月8日，中共中央政治局召开会议，审议《中国共产党领导全面依法治国工作条例》。", "o": ["正确", "错误"], "a": 0, "e": "正确。该条例对提升党领导全面依法治国的科学化、制度化、规范化水平具有重要意义。"}, {"id": "szj20", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年12月，最高人民检察院与司法部联合印发《依法保障律师阅卷权利工作规定》。", "o": ["正确", "错误"], "a": 0, "e": "正确。文件推动构建现场阅卷、异地阅卷、线上阅卷“三位一体”的保障机制。"}, {"id": "szj21", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "流花油田是我国首个深水油田，其首次开发项目于2025年12月全面投产。", "o": ["正确", "错误"], "a": 1, "e": "错误。全面投产的是流花油田二次开发项目，不是首次开发。"}, {"id": "szj22", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年12月15日，我国自主研发的彩虹-7高空高速长航时隐身无人机成功完成首飞。", "o": ["正确", "错误"], "a": 0, "e": "正确。该机型首飞实现我国大型隐身航空装备技术新突破。"}, {"id": "szj23", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2025年12月18日，海南自由贸易港正式启动全岛封关运作。", "o": ["正确", "错误"], "a": 0, "e": "正确。全面推行“‘一线’放开、‘二线’管住、岛内自由”的政策制度。"}, {"id": "szj24", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "西安至延安高速铁路开通运营后，全国高速铁路运营里程突破6万公里。", "o": ["正确", "错误"], "a": 1, "e": "错误。是突破5万公里。"}, {"id": "szj25", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年1月1日，新修订的《中华人民共和国治安管理处罚法》正式施行，首次在法律中将学生欺凌纳入治安管理规制范畴。", "o": ["正确", "错误"], "a": 0, "e": "正确。新法第六十条首次将学生欺凌纳入治安管理规制范畴。"}, {"id": "szj26", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年1月12日至14日，中国共产党第二十届中央纪律检查委员会第五次全体会议在北京召开。", "o": ["正确", "错误"], "a": 0, "e": "正确。全会部署2026年全面从严治党、党风廉政建设和反腐败重点任务。"}, {"id": "szj27", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年2月1日，《全民阅读促进条例》正式施行，条例明确设立“全民阅读活动周”。", "o": ["正确", "错误"], "a": 0, "e": "正确。该条例以法治手段护航全民阅读开展。"}, {"id": "szj28", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年2月3日发布的中央一号文件，是党的十八大以来第14个指导“三农”工作的中央一号文件。", "o": ["正确", "错误"], "a": 0, "e": "正确。文件围绕粮食安全、乡村产业、乡村治理等作出全面部署。"}, {"id": "szj29", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年2月5日，中国与越南共同宣布2026年为“中越友好年”。", "o": ["正确", "错误"], "a": 1, "e": "错误。是中国与老挝共同宣布2026年为“中老友好年”。"}, {"id": "szj30", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年全国两会在上海召开。", "o": ["正确", "错误"], "a": 1, "e": "错误。2026年全国两会在北京召开。"}, {"id": "szj31", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年3月12日，十四届全国人大四次会议表决通过《中华人民共和国生态环境法典》，这是继民法典之后我国第二部以“法典”命名的法律。", "o": ["正确", "错误"], "a": 0, "e": "正确。该法典自2026年8月15日起施行。"}, {"id": "szj32", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年3月12日，十四届全国人大四次会议表决通过《中华人民共和国民族团结进步促进法》。", "o": ["正确", "错误"], "a": 0, "e": "正确。该法自2026年7月1日起施行，是新时代第一部民族领域的专门法律。"}, {"id": "szj33", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "《中华人民共和国国家发展规划法》自2026年10月1日起施行。", "o": ["正确", "错误"], "a": 1, "e": "错误。该法自公布之日起施行。"}, {"id": "szj34", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "新修订的《中华人民共和国监狱法》自2026年12月1日起施行。", "o": ["正确", "错误"], "a": 1, "e": "错误。新修订的监狱法自2026年11月1日起施行。"}, {"id": "szj35", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年4月30日通过的《中华人民共和国社会救助法》自2026年7月1日起施行。", "o": ["正确", "错误"], "a": 0, "e": "正确。社会救助法是社会保障领域的基础性法律。"}, {"id": "szj36", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "神舟二十一号航天员乘组搭乘神舟二十一号载人飞船在东风着陆场成功着陆。", "o": ["正确", "错误"], "a": 1, "e": "错误。航天员是搭乘神舟二十二号载人飞船返回的。"}, {"id": "szj37", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年5月30日是第十个全国科技工作者日，年度活动主题为“奋进‘十五五’科技谱新篇”。", "o": ["正确", "错误"], "a": 0, "e": "正确。各地开展致敬与科普活动，大力弘扬科学家精神。"}, {"id": "szj38", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "2026年6月5日国务院常务会议审议通过《实施就业优先战略“十五五”规划》。", "o": ["正确", "错误"], "a": 0, "e": "正确。会议强调就业是民生之本，努力实现高质量充分就业。"}, {"id": "szj39", "c": "时事政治（2025.6—2026.6）", "t": "judge", "s": "第48届世界技能大赛将于2026年9月在上海举办。", "o": ["正确", "错误"], "a": 0, "e": "正确。该赛事是全球规模最大的职业技能盛会，有助于弘扬工匠精神。"}, {"id": "szj40", "c": "时事政治（20 /* ================= 基础 ================= */
const LET = "ABCDEFGHIJ";
const KEY = "sixiu.bank.v2";
const OLDKEY = "sixiu.quizbank.v1";
const SYNC_API = "https://extendsclass.com/api/json-storage/bin";
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const CH_LABEL = {};
CHAPTERS.forEach(c => CH_LABEL[c.full] = c.label);
const shortCh = c => CH_LABEL[c] || c;

let S, order = [], draft = [], peek = false, tick = null, flash = { idx: 0, flip: false };
let syncMsg = "";

const DEF = () => ({
  records:{}, fav:[], pos:0, view:"quiz", prev:null,
  shuffle:false, chapter:"all", scope:"all",
  exam:null, history:[], syncId:"", cards:{seen:0}
});
function load(){
  let s = DEF();
  try { const raw = localStorage.getItem(KEY); if (raw) s = Object.assign(s, JSON.parse(raw)); }
  catch(e){}
  if (!s.records || !Object.keys(s.records).length){
    try { const old = JSON.parse(localStorage.getItem(OLDKEY) || "null");
      if (old && old.records) { s.records = old.records; s.fav = old.fav || []; }
    } catch(e){}
  }
  return s;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const qById = id => QUESTIONS.find(q => q.id === id);
const rec = id => S.records[id];
const typeName = t => ({single:"单选题",multiple:"多选题",judge:"判断题"}[t] || t);
const wrongIds = () => QUESTIONS.filter(q => { const r = S.records[q.id]; return r && r.ok === false; }).map(q => q.id);
const doneIds  = () => QUESTIONS.filter(q => S.records[q.id]).map(q => q.id);
const rightCnt = () => QUESTIONS.filter(q => (S.records[q.id] || {}).ok).length;
const fmtTime = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60); return (m<10?"0":"")+m+":"+((s%60)<10?"0":"")+(s%60); };
const ansText = q => q.t === "multiple" ? q.a.map(k => LET[k]).join("") : LET[q.a];
const pickText = (q, p) => q.t === "multiple"
  ? (Array.isArray(p) && p.length ? p.slice().sort((a,b)=>a-b).map(k=>LET[k]).join("") : "（未作答）")
  : (p == null ? "（未作答）" : LET[p]);
const sameAnswer = (q, p) => q.t === "multiple"
  ? (Array.isArray(p) && p.length === q.a.length && [...p].sort().every((v,i)=>v===[...q.a].sort()[i]))
  : p === q.a;

function buildOrder(keepPos){
  let idx = QUESTIONS.map((_, i) => i);
  if (S.chapter !== "all") idx = idx.filter(i => QUESTIONS[i].c === S.chapter);
  if (S.scope === "undone") idx = idx.filter(i => !S.records[QUESTIONS[i].id]);
  else if (S.scope === "wrong") idx = idx.filter(i => wrongIds().includes(QUESTIONS[i].id));
  else if (S.scope === "fav") idx = idx.filter(i => S.fav.includes(QUESTIONS[i].id));
  if (S.shuffle) for (let i = idx.length-1; i > 0; i--){ const j = Math.random()*(i+1)|0; [idx[i],idx[j]]=[idx[j],idx[i]]; }
  order = idx;
  if (!keepPos || S.pos >= order.length) S.pos = 0;
}
function go(view, push){
  if (push && !["wrong","fav","review"].includes(S.view)) S.prev = S.view;
  S.view = view; peek = false; draft = []; save(); render();
}
function back(){ S.view = S.prev || "quiz"; S.prev = null; save(); render(); }

/* ================= 答题（练习） ================= */
function renderQuiz(){
  const m = $("#main"); m.innerHTML = "";
  if (!order.length){
    m.appendChild(el("div","empty", S.scope === "wrong" ? "🎉 错题本是空的<br>继续保持"
      : S.scope === "fav" ? "还没有收藏题目<br>答题时点右上角 ★ 收藏"
      : "这个范围内没有题目<br>换个筛选条件试试"));
    return;
  }
  const i = order[S.pos], q = QUESTIONS[i], r = rec(q.id), locked = !!r;
  const card = el("div","card");
  card.appendChild(el("div","meta",
    `<span class="tag">${typeName(q.t)}</span><span class="tag g">${esc(shortCh(q.c))}</span><span class="tag g">${S.pos+1} / ${order.length}</span>`));
  card.appendChild(el("p","stem", esc(q.s)));

  const box = el("div","opts");
  const isMulti = q.t === "multiple";
  const picked = locked ? r.picked : (isMulti ? draft : null);
  q.o.forEach((txt,k)=>{
    const b = el("button","opt"); b.type = "button";
    b.innerHTML = `<span class="key">${LET[k]}</span><span class="txt">${esc(txt)}</span>`;
    const sel = isMulti ? (picked||[]).includes(k) : picked === k;
    const right = isMulti ? q.a.includes(k) : q.a === k;
    if (sel) b.classList.add("sel");
    if (locked || peek){
      b.disabled = true;
      if (right) b.classList.add("ok"); else if (sel) b.classList.add("bad");
    } else b.onclick = () => { if (isMulti) toggleMulti(k); else { commit(q.id, sameAnswer(q,k), k); render(); } };
    box.appendChild(b);
  });
  card.appendChild(box);
  if (isMulti && !locked && !peek){
    card.appendChild(btns([["确认答案","primary",()=>{
      if (!draft.length) return toast("请先选择至少一项");
      commit(q.id, sameAnswer(q, draft), draft.slice()); render();
    }]]));
  }

  if (locked){
    const fb = el("div","fb " + (r.ok ? "right" : "wrong"));
    fb.appendChild(el("div","res", r.ok ? "✅ 回答正确" : "❌ 回答错误"));
    fb.appendChild(el("div","ans",
      `你的答案：<b>${esc(pickText(q, r.picked))}</b>　正确答案：<b>${esc(ansText(q))}</b>` +
      (isMulti ? `<br><span style="color:var(--muted);font-size:14px">（${esc(q.a.map(k=>q.o[k]).join(" / "))}）</span>` : "")));
    if (q.e) fb.appendChild(el("div","exp", `<span class="lab">解析</span>${esc(q.e)}`));
    card.appendChild(fb);
  } else if (peek){
    const fb = el("div","fb peek");
    fb.appendChild(el("div","res","正确答案"));
    fb.appendChild(el("div","ans", `<b>${esc(ansText(q))}</b>${isMulti ? `（${esc(q.a.map(k=>q.o[k]).join(" / "))}）` : ""}`));
    if (q.e) fb.appendChild(el("div","exp", `<span class="lab">解析</span>${esc(q.e)}`));
    card.appendChild(fb);
  }

  const row = el("div","row");
  row.appendChild(btn("上一题","sm",prev,S.pos===0));
  row.appendChild(el("div","spacer"));
  if (locked) row.appendChild(btn("重做本题","sm ghost",()=>{ delete S.records[q.id]; draft = []; save(); render(); }));
  else row.appendChild(btn(peek?"收起答案":"看答案","sm ghost",()=>{ peek = !peek; draft = []; render(); }));
  row.appendChild(btn(S.pos === order.length-1 ? "回到第一题" : "下一题","sm primary",next));
  card.appendChild(row);
  card.appendChild(el("div","hint","键盘：1-4 选选项　← → 翻页"));
  m.appendChild(card);
}
function toggleMulti(k){
  const p = draft.indexOf(k);
  p >= 0 ? draft.splice(p,1) : draft.push(k);
  render();
}
function commit(id, ok, picked){
  S.records[id] = {ok, picked, ts:Date.now()};
  draft = []; peek = false; save();
}
function next(){ if (!order.length) return; S.pos = (S.pos+1)%order.length; draft = []; peek = false; save(); render(); }
function prev(){ if (!order.length) return; S.pos = (S.pos-1+order.length)%order.length; draft = []; peek = false; save(); render(); }

/* ================= 模拟考试 ================= */
let examPick = { scope:"all", chapter:"all", count:20, limit:20 };
function renderExam(){
  const m = $("#main"); m.innerHTML = "";
  if (!S.exam) return renderExamSetup(m);
  if (!S.exam.submitted) return renderExamRun(m);
  renderExamResult(m);
}
function renderExamSetup(m){
  const card = el("div","card");
  card.appendChild(el("div","meta",`<span class="tag">模拟考试</span><span class="tag g">做完统一判分</span>`));
  card.appendChild(el("p","stem","设置好范围就开始，考试过程中不显示对错。"));

  const mk = (label, opts, cur, on) => {
    const f = el("div","field");
    f.appendChild(el("div","lab", label));
    const wrap = el("div","chips");
    opts.forEach(([v, t]) => {
      const c = el("button","chip" + (String(cur) === String(v) ? " on" : ""), esc(t));
      c.type = "button"; c.onclick = () => { on(v); render(); };
      wrap.appendChild(c);
    });
    f.appendChild(wrap); return f;
  };
  const chOpts = [["all","全部章节"]].concat(CHAPTERS.map(c => [c.full, c.label]));
  card.appendChild(mk("考试范围", chOpts, examPick.chapter, v => examPick.chapter = v));
  card.appendChild(mk("题目来源", [["all","全部题目"],["undone","没做过的"],["wrong","我的错题"],["fav","我的收藏"]], examPick.scope, v => examPick.scope = v));
  card.appendChild(mk("题量", [[10,"10 题"],[20,"20 题"],[30,"30 题"],[50,"50 题"],[999,"全部"]], examPick.count, v => examPick.count = v));
  card.appendChild(mk("时长", [[10,"10 分钟"],[20,"20 分钟"],[30,"30 分钟"],[60,"60 分钟"],[0,"不限时"]], examPick.limit, v => examPick.limit = v));

  let pool = QUESTIONS.slice();
  if (examPick.chapter !== "all") pool = pool.filter(q => q.c === examPick.chapter);
  if (examPick.scope === "undone") pool = pool.filter(q => !S.records[q.id]);
  if (examPick.scope === "wrong") pool = pool.filter(q => wrongIds().includes(q.id));
  if (examPick.scope === "fav") pool = pool.filter(q => S.fav.includes(q.id));
  const n = Math.min(examPick.count, pool.length);
  card.appendChild(el("div","hint",`本次可抽题 ${pool.length} 道，将出 ${n} 道${examPick.limit ? "，限时 " + examPick.limit + " 分钟" : ""}`));
  card.appendChild(btns([["开始考试","primary wide",()=>startExam(pool,n)]]));
  m.appendChild(card);

  const f = el("label","switch");
  f.innerHTML = `<input type="checkbox" ${S.shuffle?"checked":""}><span>考试题目随机打乱</span>`;
  f.querySelector("input").onchange = e => { S.shuffle = e.target.checked; save(); };
  m.appendChild(f);

  if (S.history.length){
    m.appendChild(el("h3","","考试记录"));
    S.history.slice().reverse().slice(0,8).forEach(h=>{
      m.appendChild(el("div","rowline",
        `<span class="t">${h.total} 题 · 用时 ${fmtTime(h.spent)}<div style="font-size:12.5px;color:var(--muted)">${h.scope}</div></span>
         <span class="v">${Math.round(h.right/h.total*100)} 分</span>`));
    });
  }
}
function startExam(pool, n){
  if (!n) return toast("这个范围没有题目");
  let list = pool.slice();
  for (let i = list.length-1; i > 0; i--){ const j = Math.random()*(i+1)|0; [list[i],list[j]]=[list[j],list[i]]; }
  list = list.slice(0, n);
  S.exam = { ids:list.map(q=>q.id), ans:{}, start:Date.now(), limit:examPick.limit*60 || 0, submitted:false, pos:0, scope:
    (examPick.chapter === "all" ? "全部章节" : shortCh(examPick.chapter)) + " · " + ({all:"全部题目",undone:"没做过的",wrong:"错题",fav:"收藏"}[examPick.scope]) };
  save(); startTick(); render();
}
function renderExamRun(m){

    `<span class="tag">${typeName(q.t)}</span><span class="tag g">第 ${E.pos+1} / ${E.ids.length} 题</span><span class="tag g">${esc(shortCh(q.c))}</span>`));
  card.appendChild(el("p","stem", esc(q.s)));

    b.innerHTML = `<span class="key">${LET[k]}</span><span class="txt">${esc(txt)}</span>`;

    };

  });

  const row = el("div","row");

    b.type = "button"; b.onclick = () => { E.pos = k; save(); render(); };
    g.appendChild(b);
  });
  f.appendChild(g);

  const sb = el("div","btns");

function submitExam(){
  const E = S.exam; if (!E || E.submitted) return;
  const rest = E.ids.filter(qid => { const a = E.ans[qid]; return a == null || (Array.isArray(a) && !a.length); }).length;
  if (rest && !confirm(`还有 ${rest} 道题没作答，确定交卷？`)) return;
  let right = 0;
  E.ids.forEach(qid=>{
    const q = qById(qid), a = E.ans[qid];
    const ok = a != null && sameAnswer(q, a);
    if (ok) right++;
    S.records[qid] = {ok, picked: (a == null ? "" : a), ts:Date.now()};
  });
  E.submitted = true; E.spent = Math.round((Date.now()-E.start)/1000);
  S.history.push({ts:Date.now(), total:E.ids.length, right, spent:E.spent, scope:E.scope});
  if (S.history.length > 50) S.history = S.history.slice(-50);
  stopTick(); save(); render();
}
function examAnsOf(q){ const a = S.exam.ans[q.id]; return a == null ? (q.t === "multiple" ? [] : null) : a; }

function startTick(){
  stopTick();

    const E = S.exam; if (!E || E.submitted){ stopTick(); return; }
    if (E.limit){
      const left = E.limit - Math.round((Date.now()-E.start)/1000);

    } else {
      const t = $("#timer");
      if (t) t.textContent = "已用 " + fmtTime(Math.round((Date.now()-E.start)/1000));

let syncInput = "";

/* ---- 云同步实现 ---- */
async function syncCreate(){
  try {
    syncMsg = "正在生成…"; render();
    const r = await fetch(SYNC_API, {method:"POST", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body:JSON.stringify({records:{}, fav:[]})});
    const d = await r.json();
    if (!d.id) throw new Error("no id");
    S.syncId = d.id; save();
    await syncPush(true);
    syncMsg = "已生成同步码：" + d.id;
  } catch(e){ syncMsg = "生成失败，请检查网络后重试"; }
  render();
}
async function syncPush(silent){
  if (!S.syncId) return;
  try {
    if (!silent){ syncMsg = "上传中…"; render(); }
    await fetch(SYNC_API + "/" + encodeURIComponent(S.syncId), {
      method:"PUT", headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body: JSON.stringify({records:S.records, fav:S.fav, updated:Date.now()})});
    syncMsg = "已上传 " + new Date().toLocaleTimeString().slice(0,5);
  } catch(e){ syncMsg = "上传失败（离线时不影响本机使用）"; }
  if (!silent) render();
}
async function syncPull(){
  if (!S.syncId) return;
  try {
    syncMsg = "下载中…"; render();
    const r = await fetch(SYNC_API + "/" + encodeURIComponent(S.syncId));
    const d = await r.json();
    let n = 0;
    Object.keys(d.records || {}).forEach(id => {
      const a = d.records[id], b = S.records[id];
      if (!b || (a.ts || 0) > (b.ts || 0)){ S.records[id] = a; n++; }
    });
    (d.fav || []).forEach(id => { if (!S.fav.includes(id)) S.fav.push(id); });
    buildOrder(true); save();
    syncMsg = "已合并 " + n + " 条记录";
  } catch(e){ syncMsg = "下载失败，请确认同步码是否正确"; }
  render();
}

  $("#title").textContent = titles[S.view] || "题库";
  $("#backBtn").style.display = ["wrong","fav","review"].includes(S.view) ? "" : "none";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === tabOf[S.view]));
  $("#tabs").style.display = ["wrong","fav","review"].includes(S.view) ? "none" : "flex";
  $("#filters").style.display = S.view === "quiz" ? "flex" : "none";

  const i = order[S.pos], q = QUESTIONS[i];
  $("#favBtn").style.display = (S.view === "quiz" && q) ? "" : "none";
  $("#favBtn").classList.toggle("on", !!(q && S.fav.includes(q.id)));

  if (S.view === "exam" && S.exam && !S.exam.submitted){
    const E = S.exam, answered = E.ids.filter(id => { const a = E.ans[id]; return a != null && (!Array.isArray(a) || a.length); }).length;
    $("#counter").textContent = answered + " / " + E.ids.length;
    $("#pbar").style.width = (answered / E.ids.length * 100) + "%";
    const left = E.limit ? E.limit - Math.round((Date.now()-E.start)/1000) : 0;
    $("#sub").innerHTML = `<span class="timer${left && left<=60 ? " warn":""}" id="timer">${E.limit ? "剩余 "+fmtTime(left) : "已用 "+fmtTime((Date.now()-E.start)/1000)}</span><span>${esc(E.scope)}</span>`;
    if (!tick) startTick();
  } else {
    stopTick();
    $("#sub").innerHTML = "";
    const done = doneIds().length;
    $("#counter").textContent = done + " / " + QUESTIONS.length;
    $("#pbar").style.width = (done / QUESTIONS.length * 100) + "%";
  }

  if (S.view === "quiz") renderQuiz();
  else if (S.view === "exam") renderExam();
  else if (S.view === "review") renderReview();
  else if (S.view === "cards") renderCards();
  else if (S.view === "wrong") renderList("wrong");
  else if (S.view === "fav") renderList("fav");
  else renderData();
}
function btn(txt, cls, fn, disabled){
  const b = el("button","btn " + (cls||""), esc(txt)); b.type = "button";
  if (disabled) b.disabled = true; else b.onclick = fn;
  return b;
}
function btns(defs){ const d = el("div","btns"); defs.forEach(([t,c,f]) => d.appendChild(btn(t,c,f))); return d; }
function toast(msg){
  let t = $("#toast");
  if (!t){ t = el("div"); t.id = "toast";
    Object.assign(t.style, {position:"fixed",left:"50%",bottom:"36px",transform:"translateX(-50%)",
      maxWidth:"86%",background:"rgba(0,0,0,.84)",color:"#fff",padding:"11px 20px",borderRadius:"12px",
      fontSize:"14px",zIndex:"99",opacity:"0",transition:"opacity .2s",pointerEvents:"none",
      WebkitBackdropFilter:"blur(10px)",backdropFilter:"blur(10px)"});
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = "0", 1500);
}

/* ================= 启动 ================= */
S = load();
(function init(){
  const cs = $("#chapterSel");
  cs.innerHTML = '<option value="all">全部章节</option>' + CHAPTERS.map(c => `<option value="${esc(c.full)}">${esc(c.label)}</option>`).join("");
  cs.value = CHAPTERS.some(c => c.full === S.chapter) ? S.chapter : "all";
  if (cs.value !== S.chapter) S.chapter = "all";
  $("#scopeSel").value = S.scope;
})();
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.view = b.dataset.v; S.prev = null; peek = false; draft = []; save(); render(); };
$("#backBtn").onclick = back;
$("#chapterSel").onchange = e => { S.chapter = e.target.value; draft = []; peek = false; buildOrder(false); save(); render(); };
$("#scopeSel").onchange = e => { S.scope = e.target.value; draft = []; peek = false; buildOrder(false); save(); render(); };
$("#favBtn").onclick = () => {
  const i = order[S.pos]; if (i == null) return;
  const id = QUESTIONS[i].id;
  S.fav = S.fav.includes(id) ? S.fav.filter(x => x !== id) : S.fav.concat(id);
  save(); toast(S.fav.includes(id) ? "已收藏" : "已取消收藏"); render();
};
document.addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (S.view === "quiz"){
    if (e.key === "ArrowRight" || e.key === "j") next();
    if (e.key === "ArrowLeft"  || e.key === "k") prev();
    if (/^[1-9]$/.test(e.key)){
      const i = order[S.pos], q = QUESTIONS[i];
      if (!q || rec(q.id) || peek) return;
      const k = +e.key - 1; if (k >= q.o.length) return;
      q.t === "multiple" ? toggleMulti(k) : (commit(q.id, sameAnswer(q,k), k), render());
    }
  } else if (S.view === "exam" && S.exam && !S.exam.submitted){
    if (e.key === "ArrowRight"){ S.exam.pos = Math.min(S.exam.ids.length-1, S.exam.pos+1); save(); render(); }
    if (e.key === "ArrowLeft"){ S.exam.pos = Math.max(0, S.exam.pos-1); save(); render(); }
  } else if (S.view === "cards"){
    if (e.key === "ArrowRight"){ flash.idx=(flash.idx+1)%CARDS.length; flash.flip=false; render(); }
    if (e.key === "ArrowLeft"){ flash.idx=(flash.idx-1+CARDS.length)%CARDS.length; flash.flip=false; render(); }
    if (e.key === " "){ flash.flip=!flash.flip; render(); }
  }
});
buildOrder(true);
render();

</script>
